name: Build dist

on:
  push:
    branches:
      - master
      - 'claude/**'
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

env:
  APP_NAME: market
  PHP_VERSION: '8.4'

jobs:
  build:
    name: Build appstore artifact
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: none
          tools: composer:v2

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: composer-dist-${{ runner.os }}-php${{ env.PHP_VERSION }}-${{ hashFiles('composer.lock') }}
          restore-keys: |
            composer-dist-${{ runner.os }}-php${{ env.PHP_VERSION }}-

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Composer dependencies (production)
        run: composer install --no-interaction --no-progress --no-dev

      - name: Install npm dependencies
        run: npm ci || npm install

      - name: Build JS bundle
        run: npm run build

      - name: Build appstore tarball
        run: make dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-dist
          path: build/dist/${{ env.APP_NAME }}.tar.gz
          if-no-files-found: error
          retention-days: 14
